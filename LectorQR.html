<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Control de Embarque - Escaneo de Tarimas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  :root {
    --navy:       #1a3a5c;
    --navy-dark:  #122840;
    --navy-light: #e8eef5;
    --bg:         #f2f4f7;
    --surface:    #ffffff;
    --surface2:   #f8f9fb;
    --border:     #dde1e8;
    --text:       #1e2530;
    --muted:      #6b7280;
    --faint:      #9aa3ae;
    --green:      #1e6e42;
    --green-bg:   #eaf4ee;
    --green-bd:   #a8d4b8;
    --orange:     #a04f00;
    --orange-bg:  #fdf1e6;
    --orange-bd:  #e8c8a0;
    --red:        #b91c1c;
    --red-bg:     #fee2e2;
    --red-bd:     #fecaca;
    --blue:       #2563eb;
    --blue-bg:    #dbeafe;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Barlow', sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }

  header {
    background: var(--navy);
    border-bottom: 3px solid var(--navy-dark);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.15);
  }
  .logo-wrap {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: white;
    border: 1px solid rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 8px; }
  .logo-wrap span { 
    font-family: 'Barlow Condensed', sans-serif; 
    font-size: 24px; 
    font-weight: 700; 
    color: white; 
  }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  main { padding: 16px 16px 0; flex: 1; min-width: 0; max-width: 600px; margin: 0 auto; width: 100%; }

  /* Validador Section */
  .validador-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .validador-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .validador-input {
    width: 100%;
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
  }
  .validador-input:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px var(--navy-light);
  }

  /* QR Reader Section */
  .qr-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .qr-section.show { display: block; }

  .btn-camara {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
    margin-bottom: 16px;
  }
  .btn-camara:active { background: var(--navy-dark); }
  .btn-camara:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  #reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
  }
  #reader video {
    border-radius: 12px;
    width: 100%;
  }

  /* Información del Embarque */
  .embarque-info {
    background: var(--navy-light);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border-left: 4px solid var(--navy);
    display: none;
  }
  .embarque-info.show { display: block; }
  .embarque-info h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: var(--navy);
    margin-bottom: 12px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 14px;
  }
  .info-label {
    font-weight: 600;
    color: var(--navy);
  }
  .info-value {
    color: var(--text);
  }

  /* Progreso */
  .progreso-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .progreso-section.show { display: block; }
  .progreso-bar {
    background: var(--border);
    border-radius: 30px;
    height: 30px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progreso-fill {
    background: linear-gradient(90deg, var(--green) 0%, #155f35 100%);
    width: 0%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 14px;
    transition: width 0.3s ease;
  }
  .contador-tarimas {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--navy);
    margin: 12px 0;
  }
  .contador-tarimas span {
    font-size: 36px;
    color: var(--green);
  }

  /* Lista de Tarimas Escaneadas */
  .tarimas-lista {
    max-height: 300px;
    overflow-y: auto;
    margin-top: 12px;
  }
  .tarima-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--green-bg);
    margin-bottom: 8px;
    border-radius: 8px;
  }
  .tarima-numero {
    font-weight: 700;
    color: var(--green);
    font-size: 16px;
  }
  .tarima-hora {
    font-size: 12px;
    color: var(--muted);
  }
  .tarima-check {
    color: var(--green);
    font-size: 20px;
  }

  /* Botones */
  .btn-enviar {
    background: linear-gradient(135deg, var(--green) 0%, #155f35 100%);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 16px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    margin-top: 16px;
    box-shadow: 0 4px 12px rgba(30, 110, 66, 0.3);
  }
  .btn-enviar:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
    box-shadow: none;
  }
  .btn-enviar:active:not(:disabled) { transform: scale(0.98); }

  .btn-whatsapp {
    background: #25D366;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 12px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-whatsapp:hover { background: #128C7E; }

  .btn-reiniciar {
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 30px;
    padding: 12px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    margin-top: 12px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px;
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  .modal-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: white;
    padding: 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-close {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .modal-body { padding: 16px; overflow-y: auto; max-height: 60vh; }

  .reporte-contenido {
    background: var(--surface2);
    border-radius: 12px;
    padding: 16px;
    font-size: 13px;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 16px;
    right: 16px;
    background: var(--navy);
    color: white;
    padding: 14px 18px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 9999;
    animation: slideUp 0.3s ease;
    box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 400px;
    margin: 0 auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .footer {
    background: var(--navy-dark);
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 12px;
    font-size: 11px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <span>GV</span>
  </div>
  <div class="header-title">Control de Embarque</div>
</header>

<main>
  <!-- Validador -->
  <div class="validador-section">
    <div class="validador-label">NOMBRE DEL VALIDADOR</div>
    <input type="text" id="validadorInput" class="validador-input" placeholder="INGRESA TU NOMBRE" maxlength="60" autocomplete="off">
  </div>

  <!-- QR Scanner -->
  <div id="qrSection" class="qr-section">
    <button id="btnIniciarCamara" class="btn-camara">
      <i class="fas fa-camera"></i> INICIAR CÁMARA
    </button>
    <div id="reader"></div>
    <button id="btnDetenerCamara" class="btn-camara" style="background: var(--orange); margin-top: 12px; margin-bottom: 0; display: none;">
      <i class="fas fa-stop"></i> DETENER CÁMARA
    </button>
  </div>

  <!-- Información del Embarque -->
  <div id="embarqueInfo" class="embarque-info">
    <h3><i class="fas fa-truck"></i> INFORMACIÓN DEL EMBARQUE</h3>
    <div class="info-grid">
      <div><span class="info-label">RUTA:</span> <span id="infoRuta" class="info-value">---</span></div>
      <div><span class="info-label">VIAJE:</span> <span id="infoViaje" class="info-value">---</span></div>
      <div><span class="info-label">ALMACÉN:</span> <span id="infoAlmacen" class="info-value">---</span></div>
      <div><span class="info-label">TOTAL TARIMAS:</span> <span id="infoTotalTarimas" class="info-value">---</span></div>
      <div><span class="info-label">FECHA:</span> <span id="infoFecha" class="info-value">---</span></div>
      <div><span class="info-label">HORA:</span> <span id="infoHora" class="info-value">---</span></div>
    </div>
  </div>

  <!-- Progreso -->
  <div id="progresoSection" class="progreso-section">
    <div class="progreso-bar">
      <div id="progresoFill" class="progreso-fill">0%</div>
    </div>
    <div class="contador-tarimas">
      📦 <span id="escaneadasCount">0</span> / <span id="totalCount">0</span> TARIMAS
    </div>
    <div class="tarimas-lista" id="tarimasLista"></div>
  </div>

  <!-- Botones -->
  <div id="botonesSection" style="display: none;">
    <button id="btnEnviarReporte" class="btn-enviar" disabled>
      <i class="fas fa-paper-plane"></i> ENVIAR REPORTE
    </button>
    <button id="btnReiniciar" class="btn-reiniciar">
      <i class="fas fa-refresh"></i> NUEVO EMBARQUE
    </button>
  </div>
</main>

<div id="modalReporte" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span>📋 REPORTE DE EMBARQUE</span>
      <button class="modal-close" id="modalReporteClose">&times;</button>
    </div>
    <div class="modal-body">
      <div id="reporteContenido" class="reporte-contenido"></div>
      <button id="btnCompartirWhatsApp" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i> COMPARTIR POR WHATSAPP
      </button>
    </div>
  </div>
</div>

<div class="footer">
  © 2026 · Control de Embarque · Todos los derechos reservados
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDocs, getDoc,
    query, where, orderBy, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyB1APqzO0tsh1Ow58-e8VBYeTYbdmLxsNI",
    authDomain:        "validacion-2026.firebaseapp.com",
    projectId:         "validacion-2026",
    storageBucket:     "validacion-2026.firebasestorage.app",
    messagingSenderId: "9004667623",
    appId:             "1:9004667623:web:5331db7cda0b94deacc842"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Variables de estado
  let html5QrCode = null;
  let camaraActiva = false;
  let embarqueActual = null;
  let tarimasEscaneadas = []; // { numero, hora, timestamp }
  let totalTarimas = 0;
  let validadorActual = '';

  // Elementos DOM
  const validadorInput = document.getElementById('validadorInput');
  const qrSection = document.getElementById('qrSection');
  const btnIniciarCamara = document.getElementById('btnIniciarCamara');
  const btnDetenerCamara = document.getElementById('btnDetenerCamara');
  const readerDiv = document.getElementById('reader');
  const embarqueInfoDiv = document.getElementById('embarqueInfo');
  const infoRuta = document.getElementById('infoRuta');
  const infoViaje = document.getElementById('infoViaje');
  const infoAlmacen = document.getElementById('infoAlmacen');
  const infoTotalTarimas = document.getElementById('infoTotalTarimas');
  const infoFecha = document.getElementById('infoFecha');
  const infoHora = document.getElementById('infoHora');
  const progresoSection = document.getElementById('progresoSection');
  const progresoFill = document.getElementById('progresoFill');
  const escaneadasCount = document.getElementById('escaneadasCount');
  const totalCount = document.getElementById('totalCount');
  const tarimasLista = document.getElementById('tarimasLista');
  const botonesSection = document.getElementById('botonesSection');
  const btnEnviarReporte = document.getElementById('btnEnviarReporte');
  const btnReiniciar = document.getElementById('btnReiniciar');
  const modalReporte = document.getElementById('modalReporte');
  const modalReporteClose = document.getElementById('modalReporteClose');
  const reporteContenido = document.getElementById('reporteContenido');
  const btnCompartirWhatsApp = document.getElementById('btnCompartirWhatsApp');

  // ========== TOAST ==========
  function showToast(msg, esError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = esError ? 'var(--red)' : 'var(--navy)';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // ========== FORMATEAR HORA ==========
  function formatearHora() {
    const ahora = new Date();
    return ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // ========== PROCESAR QR ==========
  function procesarQR(qrText) {
    if (!validadorActual) {
      showToast('⚠️ Primero ingresa tu nombre', true);
      return false;
    }

    // Extraer datos del QR usando regex
    const regex = /RUTA:\s*(\S+)\s*VIAJE:\s*(\S+)\s*ALMACEN:\s*(\S+)\s*TARIMA:\s*(\d+)\s*TOTAL TARIMAS:\s*(\d+)\s*FECHA:\s*(\S+)\s*HORA:\s*(\S+)/i;
    const match = qrText.match(regex);

    if (!match) {
      showToast('❌ QR no válido - Formato incorrecto', true);
      return false;
    }

    const [, ruta, viaje, almacen, tarimaNumero, totalTarimasStr, fecha, hora] = match;
    const tarimaNum = parseInt(tarimaNumero);
    const totalTar = parseInt(totalTarimasStr);

    // Si es el primer QR del embarque, inicializar
    if (!embarqueActual) {
      // Verificar si ya existe un embarque activo en Firebase con el mismo ID
      const embarqueId = `${ruta}_${viaje}_${almacen}`;
      
      // Inicializar embarque
      embarqueActual = {
        id: embarqueId,
        ruta,
        viaje,
        almacen,
        totalTarimas: totalTar,
        fecha,
        hora,
        validador: validadorActual,
        inicio: new Date().toISOString(),
        tarimas: []
      };
      totalTarimas = totalTar;
      
      // Mostrar información del embarque
      infoRuta.textContent = ruta;
      infoViaje.textContent = viaje;
      infoAlmacen.textContent = almacen;
      infoTotalTarimas.textContent = totalTar;
      infoFecha.textContent = fecha;
      infoHora.textContent = hora;
      embarqueInfoDiv.classList.add('show');
      
      // Cargar tarimas ya escaneadas desde Firebase
      cargarEmbarqueExistente(embarqueId);
    }

    // Verificar que los datos coincidan con el embarque actual
    if (embarqueActual.ruta !== ruta || embarqueActual.viaje !== viaje || embarqueActual.almacen !== almacen) {
      showToast('❌ Este QR pertenece a otro embarque diferente', true);
      return false;
    }

    // Verificar que la tarima no haya sido escaneada
    if (tarimasEscaneadas.some(t => t.numero === tarimaNum)) {
      showToast(`⚠️ La tarima ${tarimaNum} ya fue escaneada`, true);
      return false;
    }

    // Verificar que el número de tarima sea válido (1 - total)
    if (tarimaNum < 1 || tarimaNum > totalTarimas) {
      showToast(`❌ Tarima inválida. Debe ser entre 1 y ${totalTarimas}`, true);
      return false;
    }

    // Registrar escaneo
    const ahora = new Date();
    const nuevoEscaneo = {
      numero: tarimaNum,
      hora: formatearHora(),
      timestamp: ahora.toISOString()
    };
    
    tarimasEscaneadas.push(nuevoEscaneo);
    tarimasEscaneadas.sort((a, b) => a.numero - b.numero);
    
    // Guardar en Firebase inmediatamente
    guardarEscaneoEnFirebase(tarimaNum, nuevoEscaneo.hora);
    
    // Actualizar UI
    actualizarUI();
    
    showToast(`✅ Tarima ${tarimaNum} escaneada correctamente`);
    
    // Si se completaron todas, mostrar mensaje especial
    if (tarimasEscaneadas.length === totalTarimas) {
      showToast(`🎉 ¡FELICIDADES! Has completado el escaneo de todas las ${totalTarimas} tarimas`);
    }
    
    return true;
  }

  // ========== CARGAR EMBARQUE EXISTENTE DESDE FIREBASE ==========
  async function cargarEmbarqueExistente(embarqueId) {
    try {
      const docRef = doc(db, 'embarques', embarqueId);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.tarimas && Array.isArray(data.tarimas)) {
          tarimasEscaneadas = data.tarimas;
          actualizarUI();
          showToast(`📦 Embarque recuperado - ${tarimasEscaneadas.length} tarimas ya escaneadas`);
        }
      }
    } catch (error) {
      console.warn('Error al cargar embarque existente:', error);
    }
  }

  // ========== GUARDAR ESCANEO EN FIREBASE ==========
  async function guardarEscaneoEnFirebase(tarimaNumero, horaEscaneo) {
    if (!embarqueActual) return;
    
    try {
      const docRef = doc(db, 'embarques', embarqueActual.id);
      
      // Obtener documento actual o crear uno nuevo
      const docSnap = await getDoc(docRef);
      let tarimasActuales = [];
      
      if (docSnap.exists()) {
        tarimasActuales = docSnap.data().tarimas || [];
      }
      
      // Agregar nueva tarima si no existe
      if (!tarimasActuales.some(t => t.numero === tarimaNumero)) {
        tarimasActuales.push({
          numero: tarimaNumero,
          hora: horaEscaneo,
          timestamp: new Date().toISOString()
        });
        tarimasActuales.sort((a, b) => a.numero - b.numero);
      }
      
      await setDoc(docRef, {
        ruta: embarqueActual.ruta,
        viaje: embarqueActual.viaje,
        almacen: embarqueActual.almacen,
        totalTarimas: embarqueActual.totalTarimas,
        fecha: embarqueActual.fecha,
        hora: embarqueActual.hora,
        validador: embarqueActual.validador,
        inicio: embarqueActual.inicio,
        tarimas: tarimasActuales,
        ultimaActualizacion: new Date().toISOString(),
        completado: tarimasActuales.length === embarqueActual.totalTarimas
      }, { merge: true });
      
    } catch (error) {
      console.error('Error al guardar escaneo:', error);
      showToast('❌ Error al guardar en Firebase', true);
    }
  }

  // ========== ACTUALIZAR UI ==========
  function actualizarUI() {
    // Actualizar contadores
    const escaneadas = tarimasEscaneadas.length;
    escaneadasCount.textContent = escaneadas;
    totalCount.textContent = totalTarimas;
    
    const porcentaje = totalTarimas > 0 ? (escaneadas / totalTarimas) * 100 : 0;
    progresoFill.style.width = `${porcentaje}%`;
    progresoFill.textContent = `${Math.round(porcentaje)}%`;
    
    // Mostrar lista de tarimas
    if (tarimasEscaneadas.length > 0) {
      tarimasLista.innerHTML = tarimasEscaneadas.map(t => `
        <div class="tarima-item">
          <div>
            <div class="tarima-numero">📍 Tarima ${t.numero}</div>
            <div class="tarima-hora">${t.hora}</div>
          </div>
          <div class="tarima-check"><i class="fas fa-check-circle"></i></div>
        </div>
      `).join('');
    } else {
      tarimasLista.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">📷 Escanea la primera tarima para comenzar</div>';
    }
    
    // Activar/desactivar botón de enviar
    const completado = escaneadas === totalTarimas && totalTarimas > 0;
    btnEnviarReporte.disabled = !completado;
    
    if (completado) {
      btnEnviarReporte.style.background = 'linear-gradient(135deg, var(--green) 0%, #0a4a2a 100%)';
    } else {
      btnEnviarReporte.style.background = 'linear-gradient(135deg, var(--green) 0%, #155f35 100%)';
    }
    
    progresoSection.classList.add('show');
    botonesSection.style.display = 'block';
  }

  // ========== GENERAR REPORTE ==========
  function generarReporte() {
    if (!embarqueActual) return '';
    
    const fechaActual = new Date().toLocaleString('es-MX');
    const tarimasListaStr = tarimasEscaneadas.map(t => `  • Tarima ${t.numero} - ${t.hora}`).join('\n');
    const estado = tarimasEscaneadas.length === totalTarimas ? '✅ COMPLETADO' : `⚠️ PENDIENTE (${tarimasEscaneadas.length}/${totalTarimas})`;
    
    return `
╔══════════════════════════════════════════════════════════╗
║              REPORTE DE EMBARQUE - CONTROL               ║
╠══════════════════════════════════════════════════════════╣
║  📋 DATOS DEL EMBARQUE                                    ║
║  ──────────────────────────────────────────────────────── ║
║  RUTA:        ${embarqueActual.ruta.padEnd(40)}║
║  VIAJE:       ${embarqueActual.viaje.padEnd(40)}║
║  ALMACÉN:     ${embarqueActual.almacen.padEnd(40)}║
║  FECHA:       ${embarqueActual.fecha.padEnd(40)}║
║  HORA INICIO: ${embarqueActual.hora.padEnd(40)}║
║  ──────────────────────────────────────────────────────── ║
║  👤 VALIDADOR: ${embarqueActual.validador.padEnd(40)}║
║  ──────────────────────────────────────────────────────── ║
║  📦 TARIMAS ESCANEADAS (${tarimasEscaneadas.length}/${totalTarimas})                  ║
${tarimasListaStr}
║  ──────────────────────────────────────────────────────── ║
║  🟢 ESTADO: ${estado.padEnd(41)}║
║  ──────────────────────────────────────────────────────── ║
║  📅 REPORTE GENERADO: ${fechaActual.padEnd(36)}║
╚══════════════════════════════════════════════════════════╝
    `;
  }

  // ========== ENVIAR REPORTE A FIREBASE Y MOSTRAR MODAL ==========
  async function enviarReporte() {
    if (!embarqueActual || tarimasEscaneadas.length !== totalTarimas) {
      showToast('⚠️ Debes escanear todas las tarimas primero', true);
      return;
    }
    
    const reporte = generarReporte();
    const completado = tarimasEscaneadas.length === totalTarimas;
    
    try {
      // Actualizar Firebase con estado completado
      const docRef = doc(db, 'embarques', embarqueActual.id);
      await setDoc(docRef, {
        completado: true,
        finalizado: new Date().toISOString(),
        reporte: reporte
      }, { merge: true });
      
      // Mostrar modal con reporte
      reporteContenido.innerHTML = `<pre style="font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word;">${reporte}</pre>`;
      modalReporte.classList.add('show');
      
      showToast('✅ Reporte guardado en Firebase');
      
      // Detener cámara automáticamente
      if (camaraActiva) {
        detenerCamara();
      }
      
    } catch (error) {
      console.error('Error al guardar reporte:', error);
      showToast('❌ Error al guardar reporte', true);
    }
  }

  // ========== COMPARTIR POR WHATSAPP ==========
  function compartirWhatsApp() {
    const reporte = generarReporte();
    const textoCodificado = encodeURIComponent(reporte);
    const url = `https://wa.me/?text=${textoCodificado}`;
    window.open(url, '_blank');
  }

  // ========== REINICIAR (NUEVO EMBARQUE) ==========
  function reiniciar() {
    if (camaraActiva) {
      detenerCamara();
    }
    
    embarqueActual = null;
    tarimasEscaneadas = [];
    totalTarimas = 0;
    
    embarqueInfoDiv.classList.remove('show');
    progresoSection.classList.remove('show');
    botonesSection.style.display = 'none';
    tarimasLista.innerHTML = '';
    progresoFill.style.width = '0%';
    progresoFill.textContent = '0%';
    escaneadasCount.textContent = '0';
    totalCount.textContent = '0';
    
    // Limpiar información
    infoRuta.textContent = '---';
    infoViaje.textContent = '---';
    infoAlmacen.textContent = '---';
    infoTotalTarimas.textContent = '---';
    infoFecha.textContent = '---';
    infoHora.textContent = '---';
    
    showToast('🔄 Nuevo embarque listo para escanear');
  }

  // ========== CÁMARA ==========
  async function iniciarCamara() {
    if (!validadorActual) {
      showToast('⚠️ Primero ingresa tu nombre', true);
      return;
    }
    
    if (camaraActiva) {
      detenerCamara();
    }
    
    html5QrCode = new Html5Qrcode("reader");
    
    try {
      const devices = await Html5Qrcode.getCameras();
      if (devices && devices.length) {
        let backCamera = devices.find(device => device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environ'));
        const cameraId = backCamera ? backCamera.id : devices[0].id;
        
        await html5QrCode.start(
          cameraId,
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          (decodedText) => {
            procesarQR(decodedText);
          },
          (errorMessage) => {
            // Silenciar errores normales de escaneo
          }
        );
        
        camaraActiva = true;
        btnIniciarCamara.style.display = 'none';
        btnDetenerCamara.style.display = 'block';
        showToast('📷 Cámara activada, escanea los QR de las tarimas');
      } else {
        showToast('❌ No se encontraron cámaras', true);
      }
    } catch (error) {
      console.error('Error al iniciar cámara:', error);
      showToast('❌ Error al acceder a la cámara', true);
    }
  }
  
  function detenerCamara() {
    if (html5QrCode && camaraActiva) {
      html5QrCode.stop().then(() => {
        camaraActiva = false;
        btnIniciarCamara.style.display = 'block';
        btnDetenerCamara.style.display = 'none';
        showToast('📷 Cámara detenida');
      }).catch(err => {
        console.warn('Error al detener cámara:', err);
      });
    }
  }

  // ========== VALIDADOR INPUT ==========
  validadorInput.addEventListener('input', (e) => {
    validadorActual = e.target.value.trim().toUpperCase();
    validadorInput.value = validadorActual;
    
    // Mostrar sección QR solo si hay validador
    if (validadorActual.length >= 2) {
      qrSection.classList.add('show');
    } else {
      qrSection.classList.remove('show');
      if (camaraActiva) detenerCamara();
    }
  });

  // ========== EVENTOS ==========
  btnIniciarCamara.addEventListener('click', iniciarCamara);
  btnDetenerCamara.addEventListener('click', detenerCamara);
  btnEnviarReporte.addEventListener('click', enviarReporte);
  btnReiniciar.addEventListener('click', reiniciar);
  modalReporteClose.addEventListener('click', () => modalReporte.classList.remove('show'));
  modalReporte.addEventListener('click', (e) => {
    if (e.target === modalReporte) modalReporte.classList.remove('show');
  });
  btnCompartirWhatsApp.addEventListener('click', compartirWhatsApp);

  // ========== INICIALIZAR ==========
  console.log('App lista para escanear tarimas');
</script>
</body>
</html>
