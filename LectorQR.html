<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Control de Embarque - Escaneo de Tarimas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  :root {
    --navy:       #1a3a5c;
    --navy-dark:  #122840;
    --navy-light: #e8eef5;
    --bg:         #f2f4f7;
    --surface:    #ffffff;
    --surface2:   #f8f9fb;
    --border:     #dde1e8;
    --text:       #1e2530;
    --muted:      #6b7280;
    --faint:      #9aa3ae;
    --green:      #1e6e42;
    --green-bg:   #eaf4ee;
    --green-bd:   #a8d4b8;
    --orange:     #a04f00;
    --orange-bg:  #fdf1e6;
    --orange-bd:  #e8c8a0;
    --red:        #b91c1c;
    --red-bg:     #fee2e2;
    --red-bd:     #fecaca;
    --blue:       #2563eb;
    --blue-bg:    #dbeafe;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Barlow', sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    min-height: 100vh; 
    display: flex; 
    flex-direction: column; 
  }

  header {
    background: var(--navy);
    border-bottom: 3px solid var(--navy-dark);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.15);
  }
  .logo-wrap {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: white;
    border: 1px solid rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .logo-wrap i {
    font-size: 32px;
    color: var(--navy);
  }
  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  main { padding: 16px 16px 0; flex: 1; min-width: 0; max-width: 600px; margin: 0 auto; width: 100%; }

  /* Validador Section */
  .validador-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .validador-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .validador-input {
    width: 100%;
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .validador-input:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px var(--navy-light);
  }

  /* Botón principal flotante */
  .action-button {
    position: fixed;
    bottom: 30px;
    right: 20px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: var(--navy);
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-button:active {
    transform: scale(0.95);
  }
  .action-button.camara {
    background: var(--navy);
  }
  .action-button.enviar {
    background: var(--green);
    display: none;
  }
  .action-button.enviar.show {
    display: flex;
  }
  .action-button.camara.hide {
    display: none;
  }

  /* QR Reader Section */
  .qr-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .qr-section.show { display: block; }

  #reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
  }
  #reader video {
    border-radius: 12px;
    width: 100%;
  }

  /* Información del Embarque */
  .embarque-info {
    background: var(--navy-light);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    border-left: 4px solid var(--navy);
    display: none;
  }
  .embarque-info.show { display: block; }
  .embarque-info h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: var(--navy);
    margin-bottom: 12px;
  }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    font-size: 14px;
  }
  .info-label {
    font-weight: 600;
    color: var(--navy);
  }
  .info-value {
    color: var(--text);
  }

  /* Progreso */
  .progreso-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: none;
  }
  .progreso-section.show { display: block; }
  .progreso-bar {
    background: var(--border);
    border-radius: 30px;
    height: 30px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progreso-fill {
    background: linear-gradient(90deg, var(--green) 0%, #155f35 100%);
    width: 0%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 14px;
    transition: width 0.3s ease;
  }
  .contador-tarimas {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--navy);
    margin: 12px 0;
  }
  .contador-tarimas span {
    font-size: 36px;
    color: var(--green);
  }

  /* Dashboard de Tarimas Escaneadas */
  .tarimas-dashboard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  .dashboard-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .tarimas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
  }
  .tarima-card {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    transition: all 0.2s;
  }
  .tarima-card.escaneada {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
  }
  .tarima-card.escaneada i {
    color: var(--green);
  }
  .tarima-num {
    font-weight: 700;
    font-size: 14px;
  }
  .tarima-check-icon {
    font-size: 12px;
    margin-top: 4px;
  }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 16px;
    right: 16px;
    background: var(--navy);
    color: white;
    padding: 14px 18px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 9999;
    animation: slideUp 0.3s ease;
    box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    text-align: center;
    max-width: 400px;
    margin: 0 auto;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .footer {
    background: var(--navy-dark);
    color: rgba(255,255,255,0.35);
    text-align: center;
    padding: 12px;
    font-size: 11px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <i class="fas fa-boxes"></i>
  </div>
  <div class="header-title">Control de Embarque</div>
</header>

<main>
  <!-- Validador -->
  <div class="validador-section">
    <div class="validador-label">NOMBRE DEL VALIDADOR</div>
    <input type="text" id="validadorInput" class="validador-input" placeholder="Nombre y Apellido" autocomplete="off">
  </div>

  <!-- QR Scanner -->
  <div id="qrSection" class="qr-section">
    <div id="reader"></div>
  </div>

  <!-- Información del Embarque -->
  <div id="embarqueInfo" class="embarque-info">
    <h3><i class="fas fa-truck"></i> INFORMACIÓN DEL EMBARQUE</h3>
    <div class="info-grid">
      <div><span class="info-label">RUTA:</span> <span id="infoRuta" class="info-value">---</span></div>
      <div><span class="info-label">VIAJE:</span> <span id="infoViaje" class="info-value">---</span></div>
      <div><span class="info-label">ALMACÉN:</span> <span id="infoAlmacen" class="info-value">---</span></div>
      <div><span class="info-label">TOTAL TARIMAS:</span> <span id="infoTotalTarimas" class="info-value">---</span></div>
      <div><span class="info-label">FECHA:</span> <span id="infoFecha" class="info-value">---</span></div>
      <div><span class="info-label">HORA:</span> <span id="infoHora" class="info-value">---</span></div>
    </div>
  </div>

  <!-- Progreso -->
  <div id="progresoSection" class="progreso-section">
    <div class="progreso-bar">
      <div id="progresoFill" class="progreso-fill">0%</div>
    </div>
    <div class="contador-tarimas">
      📦 <span id="escaneadasCount">0</span> / <span id="totalCount">0</span> TARIMAS
    </div>
  </div>

  <!-- Dashboard de Tarimas -->
  <div id="dashboardSection" class="tarimas-dashboard" style="display: none;">
    <div class="dashboard-title"><i class="fas fa-check-circle"></i> TARIMAS ESCANEADAS</div>
    <div id="tarimasGrid" class="tarimas-grid"></div>
  </div>
</main>

<!-- Botón flotante -->
<button id="btnAccion" class="action-button camara">
  <i class="fas fa-camera"></i>
</button>

<div class="footer">
  © 2026 · Control de Embarque · Todos los derechos reservados
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc,
    query, where
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyB1APqzO0tsh1Ow58-e8VBYeTYbdmLxsNI",
    authDomain:        "validacion-2026.firebaseapp.com",
    projectId:         "validacion-2026",
    storageBucket:     "validacion-2026.firebasestorage.app",
    messagingSenderId: "9004667623",
    appId:             "1:9004667623:web:5331db7cda0b94deacc842"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Variables de estado
  let html5QrCode = null;
  let camaraActiva = false;
  let embarqueActual = null;
  let tarimasEscaneadas = []; // { numero, hora, timestamp }
  let totalTarimas = 0;
  let validadorActual = '';
  let vozFemenina = null;

  // Elementos DOM
  const validadorInput = document.getElementById('validadorInput');
  const qrSection = document.getElementById('qrSection');
  const readerDiv = document.getElementById('reader');
  const embarqueInfoDiv = document.getElementById('embarqueInfo');
  const infoRuta = document.getElementById('infoRuta');
  const infoViaje = document.getElementById('infoViaje');
  const infoAlmacen = document.getElementById('infoAlmacen');
  const infoTotalTarimas = document.getElementById('infoTotalTarimas');
  const infoFecha = document.getElementById('infoFecha');
  const infoHora = document.getElementById('infoHora');
  const progresoSection = document.getElementById('progresoSection');
  const progresoFill = document.getElementById('progresoFill');
  const escaneadasCount = document.getElementById('escaneadasCount');
  const totalCount = document.getElementById('totalCount');
  const dashboardSection = document.getElementById('dashboardSection');
  const tarimasGrid = document.getElementById('tarimasGrid');
  const btnAccion = document.getElementById('btnAccion');

  // ========== VOZ ==========
  function seleccionarVozFemenina() {
    return new Promise((resolve) => {
      let voces = window.speechSynthesis.getVoices();
      if (voces.length > 0) {
        resolve(encontrarMejorVozFemenina(voces));
      } else {
        window.speechSynthesis.onvoiceschanged = () => {
          voces = window.speechSynthesis.getVoices();
          resolve(encontrarMejorVozFemenina(voces));
        };
      }
    });
  }

  function encontrarMejorVozFemenina(voces) {
    const prioridadVoces = [
      { name: 'Sabina', lang: 'es-MX' },
      { name: 'Paulina', lang: 'es-MX' },
      { name: 'Mónica', lang: 'es-MX' },
      { name: 'Google español femenina', lang: 'es' },
      { pattern: /female/i, lang: /es/ }
    ];
    for (const criterio of prioridadVoces) {
      let voz = null;
      if (criterio.name) {
        voz = voces.find(v => v.name.includes(criterio.name) && v.lang.startsWith(criterio.lang));
      } else if (criterio.pattern) {
        voz = voces.find(v => v.name.match(criterio.pattern) && v.lang.match(criterio.lang));
      }
      if (voz) return voz;
    }
    return voces.find(v => v.lang.startsWith('es')) || null;
  }

  async function hablar(texto) {
    return new Promise(async (resolve) => {
      if (!vozFemenina) vozFemenina = await seleccionarVozFemenina();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-MX';
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      if (vozFemenina) utterance.voice = vozFemenina;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    });
  }

  // ========== TOAST ==========
  function showToast(msg, esError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = esError ? 'var(--red)' : 'var(--navy)';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // ========== VOZ DE PROGRESO ==========
  async function anunciarProgreso() {
    const faltantes = totalTarimas - tarimasEscaneadas.length;
    if (faltantes > 0) {
      await hablar(`Faltan ${faltantes} tarimas por escanear`);
    } else {
      await hablar(`¡Felicidades! Has completado el escaneo de todas las ${totalTarimas} tarimas`);
    }
  }

  // ========== PROCESAR QR ==========
  async function procesarQR(qrText) {
    if (!validadorActual) {
      showToast('⚠️ Primero ingresa tu nombre', true);
      return false;
    }

    // Extraer datos del QR
    const regex = /RUTA:\s*(\S+)\s*VIAJE:\s*(\S+)\s*ALMACEN:\s*(\S+)\s*TARIMA:\s*(\d+)\s*TOTAL TARIMAS:\s*(\d+)\s*FECHA:\s*(\S+)\s*HORA:\s*(\S+)/i;
    const match = qrText.match(regex);

    if (!match) {
      showToast('❌ QR no válido - Formato incorrecto', true);
      return false;
    }

    const [, ruta, viaje, almacen, tarimaNumero, totalTarimasStr, fecha, hora] = match;
    const tarimaNum = parseInt(tarimaNumero);
    const totalTar = parseInt(totalTarimasStr);

    // Si es el primer QR del embarque, inicializar
    if (!embarqueActual) {
      const embarqueId = `${ruta}_${viaje}_${almacen}`;
      
      embarqueActual = {
        id: embarqueId,
        ruta,
        viaje,
        almacen,
        totalTarimas: totalTar,
        fecha,
        hora,
        validador: validadorActual,
        inicio: new Date().toISOString(),
        tarimas: []
      };
      totalTarimas = totalTar;
      
      // Mostrar información del embarque
      infoRuta.textContent = ruta;
      infoViaje.textContent = viaje;
      infoAlmacen.textContent = almacen;
      infoTotalTarimas.textContent = totalTar;
      infoFecha.textContent = fecha;
      infoHora.textContent = hora;
      embarqueInfoDiv.classList.add('show');
      dashboardSection.style.display = 'block';
      
      // Cargar tarimas ya escaneadas desde Firebase
      await cargarEmbarqueExistente(embarqueId);
    }

    // Verificar que los datos coincidan
    if (embarqueActual.ruta !== ruta || embarqueActual.viaje !== viaje || embarqueActual.almacen !== almacen) {
      showToast('❌ Este QR pertenece a otro embarque diferente', true);
      return false;
    }

    // Verificar duplicado
    if (tarimasEscaneadas.some(t => t.numero === tarimaNum)) {
      showToast(`⚠️ La tarima ${tarimaNum} ya fue escaneada`, true);
      return false;
    }

    // Verificar rango
    if (tarimaNum < 1 || tarimaNum > totalTarimas) {
      showToast(`❌ Tarima inválida. Debe ser entre 1 y ${totalTarimas}`, true);
      return false;
    }

    // Registrar escaneo
    const ahora = new Date();
    const nuevoEscaneo = {
      numero: tarimaNum,
      hora: ahora.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
      timestamp: ahora.toISOString()
    };
    
    tarimasEscaneadas.push(nuevoEscaneo);
    tarimasEscaneadas.sort((a, b) => a.numero - b.numero);
    
    // Guardar en Firebase
    await guardarEscaneoEnFirebase(tarimaNum, nuevoEscaneo.hora);
    
    // Actualizar UI
    actualizarUI();
    
    // Anunciar por voz cuántas faltan
    await anunciarProgreso();
    
    showToast(`✅ Tarima ${tarimaNum} escaneada correctamente`);
    
    // Si se completaron todas, detener cámara y cambiar botón
    if (tarimasEscaneadas.length === totalTarimas) {
      await hablar(`¡Felicidades! Has completado el escaneo de todas las ${totalTarimas} tarimas`);
      await detenerCamara();
      
      // Cambiar botón: ocultar cámara, mostrar enviar
      btnAccion.classList.remove('camara');
      btnAccion.classList.add('enviar');
      btnAccion.innerHTML = '<i class="fas fa-paper-plane"></i>';
      btnAccion.classList.add('show');
      
      // Mostrar modal de reporte automáticamente
      await mostrarReporteYEnviar();
    }
    
    return true;
  }

  // ========== MOSTRAR REPORTE Y ENVIAR ==========
  async function mostrarReporteYEnviar() {
    if (!embarqueActual || tarimasEscaneadas.length !== totalTarimas) return;
    
    const reporte = generarReporte();
    
    try {
      // Actualizar Firebase
      const docRef = doc(db, 'embarques', embarqueActual.id);
      await setDoc(docRef, {
        completado: true,
        finalizado: new Date().toISOString(),
        reporte: reporte
      }, { merge: true });
      
      // Compartir por WhatsApp automáticamente
      const textoCodificado = encodeURIComponent(reporte);
      const url = `https://wa.me/?text=${textoCodificado}`;
      window.open(url, '_blank');
      
      showToast('✅ Reporte enviado a WhatsApp');
      
    } catch (error) {
      console.error('Error:', error);
      showToast('❌ Error al enviar reporte', true);
    }
  }

  // ========== CARGAR EMBARQUE EXISTENTE ==========
  async function cargarEmbarqueExistente(embarqueId) {
    try {
      const docRef = doc(db, 'embarques', embarqueId);
      const docSnap = await getDoc(docRef);
      
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.tarimas && Array.isArray(data.tarimas)) {
          tarimasEscaneadas = data.tarimas;
          actualizarUI();
          showToast(`📦 Embarque recuperado - ${tarimasEscaneadas.length} tarimas ya escaneadas`);
          
          // Si ya estaba completado, cambiar botón
          if (tarimasEscaneadas.length === totalTarimas && totalTarimas > 0) {
            btnAccion.classList.remove('camara');
            btnAccion.classList.add('enviar');
            btnAccion.innerHTML = '<i class="fas fa-paper-plane"></i>';
            btnAccion.classList.add('show');
          }
        }
      }
    } catch (error) {
      console.warn('Error al cargar embarque:', error);
    }
  }

  // ========== GUARDAR ESCANEO ==========
  async function guardarEscaneoEnFirebase(tarimaNumero, horaEscaneo) {
    if (!embarqueActual) return;
    
    try {
      const docRef = doc(db, 'embarques', embarqueActual.id);
      const docSnap = await getDoc(docRef);
      let tarimasActuales = [];
      
      if (docSnap.exists()) {
        tarimasActuales = docSnap.data().tarimas || [];
      }
      
      if (!tarimasActuales.some(t => t.numero === tarimaNumero)) {
        tarimasActuales.push({
          numero: tarimaNumero,
          hora: horaEscaneo,
          timestamp: new Date().toISOString()
        });
        tarimasActuales.sort((a, b) => a.numero - b.numero);
      }
      
      await setDoc(docRef, {
        ruta: embarqueActual.ruta,
        viaje: embarqueActual.viaje,
        almacen: embarqueActual.almacen,
        totalTarimas: embarqueActual.totalTarimas,
        fecha: embarqueActual.fecha,
        hora: embarqueActual.hora,
        validador: embarqueActual.validador,
        inicio: embarqueActual.inicio,
        tarimas: tarimasActuales,
        ultimaActualizacion: new Date().toISOString(),
        completado: tarimasActuales.length === embarqueActual.totalTarimas
      }, { merge: true });
      
    } catch (error) {
      console.error('Error al guardar:', error);
    }
  }

  // ========== ACTUALIZAR UI ==========
  function actualizarUI() {
    const escaneadas = tarimasEscaneadas.length;
    escaneadasCount.textContent = escaneadas;
    totalCount.textContent = totalTarimas;
    
    const porcentaje = totalTarimas > 0 ? (escaneadas / totalTarimas) * 100 : 0;
    progresoFill.style.width = `${porcentaje}%`;
    progresoFill.textContent = `${Math.round(porcentaje)}%`;
    
    // Actualizar dashboard de tarimas
    if (totalTarimas > 0) {
      const tarimasHTML = [];
      for (let i = 1; i <= totalTarimas; i++) {
        const escaneada = tarimasEscaneadas.some(t => t.numero === i);
        tarimasHTML.push(`
          <div class="tarima-card ${escaneada ? 'escaneada' : ''}">
            <div class="tarima-num">${i}</div>
            <div class="tarima-check-icon">
              ${escaneada ? '<i class="fas fa-check-circle"></i>' : '<i class="far fa-circle"></i>'}
            </div>
          </div>
        `);
      }
      tarimasGrid.innerHTML = tarimasHTML.join('');
    }
    
    progresoSection.classList.add('show');
  }

  // ========== GENERAR REPORTE ==========
  function generarReporte() {
    if (!embarqueActual) return '';
    
    const fechaActual = new Date().toLocaleString('es-MX');
    const tarimasListaStr = tarimasEscaneadas.map(t => `  • Tarima ${t.numero} - ${t.hora}`).join('\n');
    
    return `
╔══════════════════════════════════════════════════════════╗
║              REPORTE DE EMBARQUE - CONTROL               ║
╠══════════════════════════════════════════════════════════╣
║  📋 DATOS DEL EMBARQUE                                    ║
║  ──────────────────────────────────────────────────────── ║
║  RUTA:        ${embarqueActual.ruta.padEnd(40)}║
║  VIAJE:       ${embarqueActual.viaje.padEnd(40)}║
║  ALMACÉN:     ${embarqueActual.almacen.padEnd(40)}║
║  FECHA:       ${embarqueActual.fecha.padEnd(40)}║
║  HORA INICIO: ${embarqueActual.hora.padEnd(40)}║
║  ──────────────────────────────────────────────────────── ║
║  👤 VALIDADOR: ${embarqueActual.validador.padEnd(40)}║
║  ──────────────────────────────────────────────────────── ║
║  📦 TARIMAS ESCANEADAS (${tarimasEscaneadas.length}/${totalTarimas})                  ║
${tarimasListaStr}
║  ──────────────────────────────────────────────────────── ║
║  🟢 ESTADO: COMPLETADO ✅                                  ║
║  ──────────────────────────────────────────────────────── ║
║  📅 REPORTE GENERADO: ${fechaActual.padEnd(36)}║
╚══════════════════════════════════════════════════════════╝
    `;
  }

  // ========== CÁMARA ==========
  async function iniciarCamara() {
    if (!validadorActual) {
      showToast('⚠️ Primero ingresa tu nombre y apellido', true);
      return;
    }
    
    if (camaraActiva) {
      await detenerCamara();
    }
    
    qrSection.classList.add('show');
    html5QrCode = new Html5Qrcode("reader");
    
    try {
      const devices = await Html5Qrcode.getCameras();
      if (devices && devices.length) {
        let backCamera = devices.find(device => device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environ'));
        const cameraId = backCamera ? backCamera.id : devices[0].id;
        
        await html5QrCode.start(
          cameraId,
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            procesarQR(decodedText);
          },
          (errorMessage) => {}
        );
        
        camaraActiva = true;
        showToast('📷 Cámara activada, escanea los QR de las tarimas');
      } else {
        showToast('❌ No se encontraron cámaras', true);
      }
    } catch (error) {
      console.error('Error:', error);
      showToast('❌ Error al acceder a la cámara', true);
    }
  }
  
  async function detenerCamara() {
    if (html5QrCode && camaraActiva) {
      try {
        await html5QrCode.stop();
        camaraActiva = false;
        qrSection.classList.remove('show');
      } catch (err) {
        console.warn('Error al detener cámara:', err);
      }
    }
  }

  // ========== REINICIAR PROCESO ==========
  function reiniciarProceso() {
    if (camaraActiva) detenerCamara();
    
    embarqueActual = null;
    tarimasEscaneadas = [];
    totalTarimas = 0;
    
    embarqueInfoDiv.classList.remove('show');
    progresoSection.classList.remove('show');
    dashboardSection.style.display = 'none';
    tarimasGrid.innerHTML = '';
    progresoFill.style.width = '0%';
    progresoFill.textContent = '0%';
    escaneadasCount.textContent = '0';
    totalCount.textContent = '0';
    
    infoRuta.textContent = '---';
    infoViaje.textContent = '---';
    infoAlmacen.textContent = '---';
    infoTotalTarimas.textContent = '---';
    infoFecha.textContent = '---';
    infoHora.textContent = '---';
    
    // Restaurar botón a cámara
    btnAccion.classList.remove('enviar', 'show');
    btnAccion.classList.add('camara');
    btnAccion.innerHTML = '<i class="fas fa-camera"></i>';
    
    showToast('🔄 Listo para nuevo embarque');
  }

  // ========== VALIDADOR INPUT ==========
  validadorInput.addEventListener('input', (e) => {
    validadorActual = e.target.value.trim();
    validadorInput.value = validadorActual;
  });

  // ========== BOTÓN DE ACCIÓN ==========
  btnAccion.addEventListener('click', async () => {
    if (btnAccion.classList.contains('camara')) {
      await iniciarCamara();
    } else if (btnAccion.classList.contains('enviar')) {
      await mostrarReporteYEnviar();
    }
  });

  // ========== INICIALIZAR VOZ ==========
  seleccionarVozFemenina().then(voz => { vozFemenina = voz; });
  
  console.log('App lista para escanear tarimas');
</script>
</body>
